<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tejas’s Gym Week</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F3F5;--surface:#FFFFFF;--ink:#1B1D21;--muted:#616872;--line:#DEE1E6;--tile:rgba(27,29,33,.055);
  --red:#C8221A;--red-ink:#FFFFFF;--red-soft:#FBE8E6;--steel:#7B838D;
  --fig:#1B1D21;--far:#A4AAB2;--ground:#CDD2D8;--cable:#59616B;--wall:#D9DCE1;
  --display:'Barlow Condensed','Arial Narrow','Roboto Condensed',sans-serif;
  --body:'Barlow','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15171A;--surface:#1E2125;--ink:#EDEFF2;--muted:#9AA1AA;--line:#2D3137;--tile:rgba(237,239,242,.05);
  --red:#E3392E;--red-ink:#FFFFFF;--red-soft:#3A1D1B;--steel:#8C949E;
  --fig:#EDEFF2;--far:#5E656E;--ground:#373C43;--cable:#8C949E;--wall:#2B2F35;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#15171A;--surface:#1E2125;--ink:#EDEFF2;--muted:#9AA1AA;--line:#2D3137;--tile:rgba(237,239,242,.05);
  --red:#E3392E;--red-ink:#FFFFFF;--red-soft:#3A1D1B;--steel:#8C949E;
  --fig:#EDEFF2;--far:#5E656E;--ground:#373C43;--cable:#8C949E;--wall:#2B2F35;color-scheme:dark;}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--red);outline-offset:2px;border-radius:6px}
.wrap{max-width:820px;margin:0 auto;padding:20px 18px 48px}
.tiles{background-color:var(--surface);background-image:linear-gradient(var(--tile) 1px,transparent 1px),linear-gradient(90deg,var(--tile) 1px,transparent 1px);background-size:28px 28px;background-position:-1px -1px}
svg.fig{display:block;width:100%;height:100%}

/* header + week */
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px}
.top p{margin:0}
.who{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.01em}
#range{color:var(--muted);font-size:14px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:28px}
.day{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 2px 11px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;transition:background .15s,border-color .15s}
.day-d{font-size:13px;color:var(--muted);font-weight:500}
.day-t{max-width:100%;overflow:hidden;font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:-.01em;line-height:1.1;white-space:nowrap}
.day.today::after{content:"";position:absolute;left:30%;right:30%;bottom:4px;height:3px;border-radius:2px;background:var(--red)}
.day.sel{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.day.sel .day-d{color:var(--bg);opacity:.75}
.day-tick{position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--red);display:none}
.day.done .day-tick{display:block}

/* hero */
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;align-items:end;margin-bottom:36px}
.hero-when{margin:0 0 2px;color:var(--muted);font-weight:500}
.hero-title{white-space:nowrap;font-family:var(--display);font-weight:800;font-size:clamp(60px,17vw,150px);line-height:.8;letter-spacing:-.015em;margin:0 0 14px}
.hero-sub{margin:0 0 20px;max-width:36ch;font-size:17px}
.hero-cta{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.hero-fig{border-radius:20px;aspect-ratio:240/206;overflow:hidden;border:1px solid var(--line)}
.badge{font-size:14px;font-weight:600;color:var(--red);background:var(--red-soft);padding:5px 11px;border-radius:999px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 20px;font-family:var(--display);font-weight:700;font-size:20px;line-height:1.1;text-decoration:none;text-align:center}
.btn.primary{background:var(--red);color:var(--red-ink)}
.btn.primary:active{transform:translateY(1px)}
.btn.big{padding:16px 28px;font-size:23px;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
@media (max-width:560px){
  .hero{grid-template-columns:minmax(0,1fr) 120px;gap:12px}
  .hero-text{display:contents}
  .hero-when{grid-column:1/-1}
  .hero-title{grid-column:1;align-self:end;margin:0}
  .hero-fig{grid-column:2;grid-row:2;border-radius:16px}
  .hero-sub,.hero-cta{grid-column:1/-1;margin:0}
  .hero-cta .btn.big{flex:1 1 auto}
}

/* plan */
.group{margin-bottom:30px}
.group-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:4px}
.group-head h2{font-family:var(--display);font-weight:700;font-size:30px;line-height:1;margin:0}
.group-head span{color:var(--muted);font-size:14px}
.rows{list-style:none;margin:0;padding:0}
.rows li+li{border-top:1px solid var(--line)}
.row{width:100%;display:grid;grid-template-columns:76px 1fr 22px;gap:14px;align-items:center;background:none;border:0;padding:10px 2px;text-align:left}
.row:hover .row-name{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.thumb{position:relative;width:76px;height:76px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.num{position:absolute;left:5px;top:4px;font-family:var(--display);font-weight:800;font-size:17px;line-height:1;color:var(--red)}
.row-main{display:flex;flex-direction:column;min-width:0}
.row-name{font-weight:600;font-size:16px;line-height:1.3}
.row-rx{font-family:var(--display);font-weight:600;font-size:19px;color:var(--muted);line-height:1.2;margin-top:2px}
.row-go svg{width:22px;height:22px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* rules */
.rules{border-top:2px solid var(--ink);padding-top:10px}
.rules summary{font-family:var(--display);font-weight:700;font-size:26px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
.rules summary::-webkit-details-marker{display:none}
.rules summary::after{content:"+";font-size:30px;color:var(--red)}
.rules[open] summary::after{content:"−"}
.rules dl{margin:10px 0 0;display:grid;gap:14px}
.rules dt{font-weight:600}
.rules dd{margin:2px 0 0;color:var(--muted);max-width:62ch}
.foot{color:var(--muted);font-size:13px;margin-top:28px}

/* sheet */
.sheet{position:fixed;inset:0;z-index:30;background:rgba(10,11,13,.45);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s}
.sheet.open{opacity:1}
.sheet-panel{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:14px 20px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(40px);transition:transform .22s ease-out}
.sheet.open .sheet-panel{transform:none}
.sheet-close{float:right;margin:0 0 6px 10px}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;padding:0}
.icon-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.sheet-fig{clear:both;border-radius:18px;aspect-ratio:240/206;border:1px solid var(--line);overflow:hidden;margin-bottom:14px}
.sheet-panel h2{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;margin:0 0 6px}
.sheet-rx{font-family:var(--display);font-weight:600;font-size:22px;margin:0}
.sheet-eq,.sheet-last{color:var(--muted);margin:4px 0 0}
.sheet-last b{color:var(--ink)}
.cues{margin:16px 0 20px;padding-left:20px}
.cues li{margin:4px 0}
.cues li::marker{color:var(--red)}
.sheet-actions{display:flex;flex-direction:column;gap:10px}

/* player */
.player{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.pl-top{display:flex;align-items:center;gap:12px;padding:10px 16px 8px}
.pl-where{flex:1;display:flex;flex-direction:column;line-height:1.2}
.pl-where b{font-family:var(--display);font-size:20px;font-weight:700}
.pl-where span{color:var(--muted);font-size:14px}
#plClock{font-family:var(--display);font-weight:600;font-size:20px;font-variant-numeric:tabular-nums;color:var(--muted)}
.icon-btn.off{opacity:.55}
.icon-btn.off .wave{display:none}
.icon-btn:not(.off) .mute{display:none}
.pl-bar{height:4px;background:var(--line);margin:0 16px}
.pl-bar i{display:block;height:100%;width:0;background:var(--red);border-radius:2px;transition:width .3s}
.pl-body{flex:1;min-height:0;display:grid;grid-template-rows:minmax(150px,1fr) auto;gap:6px;padding:12px 16px 0;max-width:1100px;width:100%;margin:0 auto}
.pl-stage{border-radius:20px;border:1px solid var(--line);overflow:hidden;min-height:0;display:flex;align-items:center;justify-content:center;transition:opacity .25s}
.pl-stage svg{max-width:100%;max-height:100%;width:auto;height:100%}
.pl-stage.resting{opacity:.45}
.pl-info{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:6px}
#plName{font-family:var(--display);font-weight:800;font-size:clamp(26px,7vw,40px);line-height:1;margin:0}
#plEq{color:var(--muted);margin:4px 0 0;font-size:15px}
.pips{display:flex;gap:6px;margin:10px 0 0;min-height:8px}
.pips i{width:26px;height:6px;border-radius:3px;background:var(--line)}
.pips i.d{background:var(--ink)}
.pips i.c{background:var(--red)}
.pl-big{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:150px;margin-top:4px}
.pl-big svg.ring{position:absolute;width:150px;height:150px;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-90deg)}
.ring circle{fill:none}
.ring .track{stroke:var(--line);stroke-width:8}
.ring .notch{stroke:var(--steel);stroke-width:2;stroke-dasharray:1 10.31;opacity:.6}
#plArc{stroke:var(--red);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .12s linear}
#plBig{position:relative;font-family:var(--display);font-weight:800;font-size:clamp(76px,22vw,112px);line-height:.9;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
#plBig.long{font-size:clamp(46px,12vw,64px)}
.pl-big.timed #plBig{font-size:46px}
#plLbl{position:relative;font-weight:600;font-size:15px;margin-top:4px}
#plUp{color:var(--muted);font-size:14px;min-height:21px;margin:2px 0 0}
.resting-ui #plBig{color:var(--red)}
.pl-weight{display:flex;align-items:center;gap:8px;margin-top:6px}
.pl-weight label{color:var(--muted);font-size:15px}
.pl-weight input{width:84px;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-family:var(--display);font-weight:700;font-size:20px;text-align:center}
.pl-tips{display:flex;gap:16px;margin-top:8px;font-size:15px;align-items:center}
.pl-tips details{text-align:left}
.pl-tips summary{color:var(--ink);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.pl-tips ul{margin:6px 0 0;padding-left:18px;max-width:40ch}
.pl-tips ul li::marker{color:var(--red)}
.pl-tips a{color:var(--ink);font-weight:600;text-underline-offset:3px;text-decoration-thickness:1px}
.pl-actions{display:grid;grid-template-columns:1fr 1.7fr 1fr;gap:10px;padding:12px 16px 14px;max-width:720px;width:100%;margin:0 auto}
.pl-actions .btn{padding:16px 8px;font-size:19px}
.pl-actions .btn.primary{font-size:24px}
.pl-finish{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.pl-finish h2{font-family:var(--display);font-weight:800;font-size:clamp(56px,16vw,104px);line-height:.85;margin:0 0 14px}
.pl-finish p{max-width:36ch;margin:0 0 24px;color:var(--muted)}
@media (min-width:900px) and (min-height:560px){
  .pl-body{grid-template-columns:1.2fr 1fr;grid-template-rows:1fr;gap:28px;align-items:center;padding-top:20px}
  .pl-stage{height:100%}
}
@media (max-height:700px){.pl-big{min-height:118px}.pl-big svg.ring{width:118px;height:118px}#plBig{font-size:clamp(60px,18vw,84px)}.pl-big.timed #plBig{font-size:38px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="wrap">
  <header class="top"><p class="who">Tejas’s gym week</p><p id="range"></p></header>
  <nav class="week" id="week" aria-label="Days of the week"></nav>
  <section class="hero" id="hero"></section>
  <div id="plan"></div>
  <details class="rules"><summary>Training rules</summary><dl id="rulesList"></dl></details>
  <p class="foot">The figures show the movement pattern. Tap any exercise for form tips and a link to a real video demo. Weights you log are saved on this device.</p>
</main>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-panel">
    <button class="icon-btn sheet-close" id="sheetClose" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div id="sheetBody"></div>
  </div>
</div>

<div class="player" id="player" hidden role="dialog" aria-modal="true" aria-label="Workout">
  <div class="pl-top">
    <button class="icon-btn" id="plClose" aria-label="End session"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="pl-where"><b id="plPhase"></b><span id="plCount"></span></div>
    <span id="plClock" aria-label="Session time">0:00</span>
    <button class="icon-btn" id="plSound"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="wave" d="M16 9a4 4 0 010 6M18.5 6.5a7.5 7.5 0 010 11"/><path class="mute" d="M16 9l5 6M21 9l-5 6"/></svg></button>
  </div>
  <div class="pl-bar"><i id="plBar"></i></div>
  <div class="pl-body" id="plMainWrap">
    <div class="pl-stage tiles" id="plStage"></div>
    <div class="pl-info" id="plInfo">
      <h2 id="plName"></h2>
      <p id="plEq"></p>
      <div class="pips" id="plSets" role="img"></div>
      <div class="pl-big" aria-live="polite">
        <svg class="ring" id="plRing" viewBox="0 0 120 120" hidden><circle class="track" cx="60" cy="60" r="54"/><circle class="notch" cx="60" cy="60" r="44"/><circle id="plArc" cx="60" cy="60" r="54"/></svg>
        <span id="plBig"></span><span id="plLbl"></span>
      </div>
      <p id="plUp"></p>
      <div class="pl-weight" id="plWeight" hidden><label for="plKg">Weight used</label><input id="plKg" inputmode="decimal" autocomplete="off" placeholder="—"><span>kg</span></div>
      <div class="pl-tips"><details><summary>Form tips</summary><ul id="plCues"></ul></details><a id="plDemo" target="_blank" rel="noopener">Video demo</a></div>
    </div>
  </div>
  <div class="pl-actions" id="plActs">
    <button class="btn ghost" id="plLeft">Previous</button>
    <button class="btn primary" id="plMain">Start</button>
    <button class="btn ghost" id="plRight">Next exercise</button>
  </div>
  <div class="pl-finish" id="plFinish" hidden>
    <h2 id="finTitle"></h2><p id="finSub"></p>
    <button class="btn primary big" id="finBack">Back to the week</button>
  </div>
</div>
<script>
/* ---------- figure engine ---------- */
const LEN={torso:50,neck:14,head:10,ua:27,fa:25,th:38,sh:38};
const RAD=Math.PI/180;
const dir=a=>[Math.sin(a*RAD),Math.cos(a*RAD)];
const angOf=(dx,dy)=>Math.atan2(dx,dy)/RAD;
const add=(p,v,k=1)=>[p[0]+v[0]*k,p[1]+v[1]*k];

function ik(root,target,a,b,bend){
  const dx=target[0]-root[0],dy=target[1]-root[1];
  let d=Math.hypot(dx,dy);
  d=Math.max(Math.abs(a-b)+0.01,Math.min(a+b-0.01,d));
  const base=angOf(dx,dy);
  const c=Math.max(-1,Math.min(1,(a*a+d*d-b*b)/(2*a*d)));
  const a1=base+bend*Math.acos(c)/RAD;
  const j=add(root,dir(a1),a);
  return [a1,angOf(target[0]-j[0],target[1]-j[1])];
}

function solve(T,p){
  const front=T.view==='front';
  const t=p.t??180, tl=(p.tl??1)*LEN.torso;
  const bend=T.bend||{};
  const H=p.at?[p.at[0],p.at[1]]:[120,120];
  const N=add(H,dir(t),tl);
  const sy=p.sy||0;
  let S1,S2,P1,P2;
  if(front){
    S1=add(add(N,dir(t+90),15),dir(t),sy);S2=add(add(N,dir(t-90),15),dir(t),sy);
    P1=add(H,dir(t+90),8);P2=add(H,dir(t-90),8);
  }else{S1=S2=add(N,dir(t),sy);P1=P2=H;}
  const head=add(N,dir(t+(p.hd||0)),LEN.neck+sy*0.8);
  const out={H,N,head,S1,S2,P1,P2,front,t,cv:p.cv||0};
  for(const k of [1,2]){
    // arms
    const S=k===1?S1:S2, us=p['us'+k]??1, fs=p['fs'+k]??1;
    const a=LEN.ua*us,b=LEN.fa*fs;
    let ang;
    let tgt=p['h'+k];
    if(p['hr'+k]){const r=p['hr'+k];tgt=add(add(N,dir(t),r[0]),dir(t-90),r[1]);}
    if(tgt)ang=ik(S,tgt,a,b,bend['a'+k]??-1);else ang=p['a'+k]||[0,0];
    const E=add(S,dir(ang[0]),a),W=add(E,dir(ang[1]),b);
    out['E'+k]=E;out['W'+k]=W;out['fa'+k]=ang[1];
    // legs
    const P=k===1?P1:P2;
    let la;
    if(p['f'+k])la=ik(P,p['f'+k],LEN.th,LEN.sh,bend['l'+k]??1);else la=p['l'+k]||[0,0];
    const K=add(P,dir(la[0]),LEN.th),F=add(K,dir(la[1]),LEN.sh);
    out['K'+k]=K;out['F'+k]=F;
    const ft=p['ft'+k]??(front?(k===1?-90:90):la[1]+90);
    out['T'+k]=add(F,dir(ft),front?5:11);
  }
  return out;
}

const PT={h1:'W1',h2:'W2',f1:'F1',f2:'F2',k1:'K1',k2:'K2',H:'H',N:'N',e1:'E1'};
function ptOf(P,ref){return Array.isArray(ref)?ref:P[PT[ref]||ref];}
const f1=n=>Math.round(n*10)/10;
const ln=(a,b,c,w,o='')=>`<line x1="${f1(a[0])}" y1="${f1(a[1])}" x2="${f1(b[0])}" y2="${f1(b[1])}" style="stroke:${c}" stroke-width="${w}" stroke-linecap="round"${o}/>`;
const pl=(pts,c,w)=>`<polyline points="${pts.map(p=>f1(p[0])+','+f1(p[1])).join(' ')}" fill="none" style="stroke:${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;

function sceneSVG(it,C){
  switch(it.k){
    case 'pad':return ln([it.x1,it.y1],[it.x2,it.y2],C.pad,it.w||7);
    case 'steel':return ln([it.x1,it.y1],[it.x2,it.y2],C.steel,it.w||4);
    case 'pulley':return `<circle cx="${it.x}" cy="${it.y}" r="5" fill="none" style="stroke:${C.steel}" stroke-width="2.5"/><circle cx="${it.x}" cy="${it.y}" r="1.4" style="fill:${C.steel}"/>`;
    case 'roller':return `<circle cx="${it.x}" cy="${it.y}" r="${it.r||6}" style="fill:${C.pad}"/>`;
    case 'step':return `<rect x="${it.x1}" y="${it.y}" width="${it.x2-it.x1}" height="${200-it.y}" rx="1.5" style="fill:${C.steel}"/>`;
    case 'wall':return `<rect x="${it.x-6}" y="20" width="6" height="180" style="fill:${C.wall}"/>`;
    case 'stack':return `<rect x="${it.x}" y="${it.y}" width="${it.w}" height="${200-it.y}" rx="2" style="fill:${C.steel}" opacity=".55"/>`;
  }
  return '';
}

function propSVG(pr,P,C,layer){
  const at=pr.at?ptOf(P,pr.at):null;
  switch(pr.k){
    case 'cable':{if(layer!=='back')return '';const a=pr.from,b=ptOf(P,pr.to);
      return ln(a,b,C.cable,1.4)+`<circle cx="${a[0]}" cy="${a[1]}" r="5" fill="none" style="stroke:${C.steel}" stroke-width="2.5"/>`;}
    case 'band':{if(layer!=='front')return '';return ln(ptOf(P,pr.a),ptOf(P,pr.b),C.red,2.5);}
    case 'plate':{if(layer!==(pr.layer||'front'))return '';
      return `<circle cx="${f1(at[0])}" cy="${f1(at[1])}" r="${pr.r||13}" fill="none" style="stroke:${C.red}" stroke-width="4.5"/><circle cx="${f1(at[0])}" cy="${f1(at[1])}" r="2.6" style="fill:${C.steel}"/>`;}
    case 'grip':{if(layer!=='front')return '';return `<circle cx="${f1(at[0])}" cy="${f1(at[1])}" r="3.2" style="fill:${C.steel}"/>`;}
    case 'db':{const far=pr.at==='h2';if(layer!==(far?'mid':'front'))return '';
      if(P.front){const x=at[0],y=at[1];return ln([x-6,y],[x+6,y],C.steel,2.5)+`<rect x="${f1(x-10)}" y="${f1(y-5)}" width="5" height="10" rx="1" style="fill:${far?C.far:C.fig}"/><rect x="${f1(x+5)}" y="${f1(y-5)}" width="5" height="10" rx="1" style="fill:${far?C.far:C.fig}"/>`;}
      return `<circle cx="${f1(at[0])}" cy="${f1(at[1])}" r="6.5" style="fill:${far?C.far:C.fig}"/><circle cx="${f1(at[0])}" cy="${f1(at[1])}" r="2" style="fill:${C.steel}"/>`;}
  }
  return '';
}

function figSVG(T,p,C){
  const P=solve(T,p);
  const fr=P.front;
  let s=ln([6,200.5],[234,200.5],C.ground,2);
  for(const it of T.scene||[])s+=sceneSVG(it,C);
  for(const pr of T.props||[])s+=propSVG(pr,P,C,'back');
  const W=fr?7:7;
  const farC=fr?C.fig:C.far;
  // far limbs
  s+=pl([P.P2,P.K2,P.F2,P.T2],farC,W);
  s+=pl([P.S2,P.E2,P.W2],farC,W-0.5);
  for(const pr of T.props||[])s+=propSVG(pr,P,C,'mid');
  // torso
  if(fr){
    s+=pl([P.S1,P.S2],C.fig,8)+pl([P.P1,P.P2],C.fig,9)+ln(P.H,P.N,C.fig,13);
  }else if(P.cv){
    const m=add([(P.H[0]+P.N[0])/2,(P.H[1]+P.N[1])/2],dir(P.t-90),P.cv);
    s+=`<path d="M${f1(P.H[0])},${f1(P.H[1])} Q${f1(m[0])},${f1(m[1])} ${f1(P.N[0])},${f1(P.N[1])}" fill="none" style="stroke:${C.fig}" stroke-width="10" stroke-linecap="round"/>`;
  }else s+=ln(P.H,P.N,C.fig,10);
  s+=`<circle cx="${f1(P.head[0])}" cy="${f1(P.head[1])}" r="${LEN.head}" style="fill:${C.fig}"/>`;
  // near limbs
  s+=pl([P.P1,P.K1,P.F1,P.T1],C.fig,W);
  s+=pl([P.S1,P.E1,P.W1],C.fig,W-0.5);
  for(const pr of T.props||[])s+=propSVG(pr,P,C,'front');
  return s;
}

/* ---------- timeline ---------- */
const ease=x=>0.5-0.5*Math.cos(Math.PI*x);
function lerpV(a,b,k){
  if(a===undefined)return b;if(b===undefined)return a;
  if(Array.isArray(a))return a.map((v,i)=>v+(b[i]-v)*k);
  if(typeof a==='number')return a+(b-a)*k;
  return k<0.5?a:b;
}
function lerpPose(A,B,k){const o={};for(const key of new Set([...Object.keys(A),...Object.keys(B)]))o[key]=lerpV(A[key],B[key],k);return o;}
function poseAt(T,time){
  const P=T.poses,m=T.mode||'rep';
  if(P.length===1)return P[0];
  if(m==='hold'){const k=(Math.sin(time*2*Math.PI/4.5)+1)/2;return lerpPose(P[0],P[1],ease(k));}
  if(m==='flow'){const d=T.dur||0.6,n=P.length-1,u=(time/d)%n,i=Math.floor(u);return lerpPose(P[i],P[i+1],T.linear?u-i:ease(u-i));}
  const seq=m==='alt'?[0,1,0,2]:[0,1];
  const hold=T.hold??0.35,mv=T.move??[0.9,1.1];
  const segs=[];
  for(let i=0;i<seq.length;i++){const a=seq[i],b=seq[(i+1)%seq.length];
    segs.push({a,b,d:hold,still:true});
    segs.push({a,b,d:Array.isArray(mv)?mv[i%2]:mv});}
  const tot=segs.reduce((s,x)=>s+x.d,0);let u=time%tot;
  for(const sg of segs){if(u<sg.d){return sg.still?P[sg.a]:lerpPose(P[sg.a],P[sg.b],ease(u/sg.d));}u-=sg.d;}
  return P[0];
}

const $=s=>document.querySelector(s);

/* ---------- plan -> steps ---------- */
const exName=(x,o={})=>o.light?'Light '+EX[x].n.charAt(0).toLowerCase()+EX[x].n.slice(1):EX[x].n;
function mkWarm(w){
  const segs=[];
  if(w.secs)segs.push({type:'work',secs:w.secs});
  else for(let i=1;i<=w.sets;i++){
    segs.push(w.hold?{type:'work',secs:w.hold,set:i,of:w.sets}:{type:'work',reps:w.reps,set:i,of:w.sets});
    if(i<w.sets)segs.push({type:'rest',secs:20});
  }
  const rx=w.secs?w.p:w.hold?`${w.sets} × ${w.hold} s`:w.sets>1?`${w.sets} × ${w.reps}`:w.reps;
  return {x:w.x,phase:'Warm-up',name:exName(w.x,w),rx,segs};
}
function mkRamp(work){
  const x=work[0];
  const ramp=[['10','Empty bar'],['6','About 50% of your working weight'],['3','About 70% of your working weight']];
  const segs=[];
  ramp.forEach(([r,l],i)=>{segs.push({type:'work',reps:r,note:l,set:i+1,of:3});if(i<2)segs.push({type:'rest',secs:60});});
  return {x,phase:'Warm-up',name:'Ramp-up sets: '+EX[x].n,rx:'10 / 6 / 3',segs,ramp:true};
}
function mkWork(w){
  const [x,sets,reps,o={}]=w;const segs=[];
  const rest=o.hold?45:EX[x].c?150:75;
  for(let i=1;i<=sets;i++){
    segs.push(o.hold?{type:'work',secs:o.hold,set:i,of:sets}:{type:'work',reps,set:i,of:sets,log:true});
    if(i<sets)segs.push({type:'rest',secs:rest});
  }
  return {x,phase:'Workout',name:EX[x].n,rx:`${sets} × ${reps}`,segs,rest};
}
function mkStretch(s){
  const segs=[];
  if(s.sides===1)segs.push({type:'work',secs:30,note:'Hold'});
  else{const L=s.labels||['Side 1','Side 2'];segs.push({type:'work',secs:30,note:L[0]},{type:'rest',secs:5,switch:true},{type:'work',secs:30,note:L[1]});}
  return {x:s.x,phase:'Stretch',name:EX[s.x].n,rx:s.sides===2?(s.labels?'30 s each position':'30 s each side'):'30 s',segs};
}
function stepsFor(day){
  if(day.type==='rest')return [...STRETCH.legs,...STRETCH.pull].map(mkStretch);
  return [...WARM_GENERAL.map(mkWarm),...WARM[day.type].map(w=>w.ramp?mkRamp(day.work[0]):mkWarm(w)),...day.work.map(mkWork),...STRETCH[day.type].map(mkStretch)];
}
const segSecs=s=>s.secs||35;
const stepSecs=st=>st.segs.reduce((a,s)=>a+segSecs(s),0)+10;
const mins=steps=>Math.max(5,Math.round(steps.reduce((a,s)=>a+stepSecs(s),0)/300)*5);

/* ---------- figures ---------- */
const figs=new Set();
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.target._f)e.target._f.vis=e.isIntersecting;}),{rootMargin:'80px'});
const bbCache={};
function bbox(k){
  if(bbCache[k])return bbCache[k];
  const T=TP[k];let x0=1e9,y0=1e9,x1=-1e9,y1=201;
  for(let t=0;t<6;t+=0.2){const P=solve(T,poseAt(T,t));
    for(const n of ['H','N','S1','S2','E1','E2','W1','W2','K1','K2','F1','F2','T1','T2']){x0=Math.min(x0,P[n][0]);x1=Math.max(x1,P[n][0]);y0=Math.min(y0,P[n][1]);y1=Math.max(y1,P[n][1]);}
    x0=Math.min(x0,P.head[0]-10);x1=Math.max(x1,P.head[0]+10);y0=Math.min(y0,P.head[1]-10);}
  x0-=16;x1+=16;y0-=14;y1=Math.max(y1,201)+4;
  let w=x1-x0,h=y1-y0;
  if(w<h){x0-=(h-w)/2;w=h;}else{y0-=(w-h);h=w;}
  return bbCache[k]=[x0,y0,w,h].map(v=>Math.round(v)).join(' ');
}
function makeFig(k,cls,always){
  const svg=document.createElementNS(NS,'svg');
  svg.setAttribute('viewBox',always==='full'?'0 0 240 206':bbox(k));
  svg.setAttribute('class','fig '+(cls||''));svg.setAttribute('aria-hidden','true');
  const g=document.createElementNS(NS,'g');svg.appendChild(g);
  const f={g,T:TP[k],vis:false,always:!!always,off:Math.random()*2,anim:!!always||!REDUCE,svg};
  svg._f=f;figs.add(f);if(!always)io.observe(svg);
  g.innerHTML=figSVG(f.T,poseAt(f.T,1.3),C);
  return svg;
}
function loop(ts){
  const t=ts/1000;
  for(const f of figs){
    if(!f.svg.isConnected){figs.delete(f);io.unobserve(f.svg);continue;}
    if(f.anim&&(f.vis||f.always))f.g.innerHTML=figSVG(f.T,poseAt(f.T,t+f.off),C);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function fmtRange(){const e=new Date(WEEK);e.setDate(e.getDate()+6);

  return WEEK.getMonth()===e.getMonth()?`${WEEK.getDate()}–${e.getDate()} ${m(e)}`:`${WEEK.getDate()} ${m(WEEK)} – ${e.getDate()} ${m(e)}`;}
function renderWeek(){

/* ---------- player ---------- */
const PS={steps:[],si:0,gi:0,running:false,end:0,left:0,timer:null,t0:0,fig:null,figKey:null,sets:0};
let actx=null;
function tone(f,d,v=0.25){
  if(!store.sound)return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();
    const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(actx.destination);
    const n=actx.currentTime;g.gain.setValueAtTime(0.0001,n);g.gain.exponentialRampToValueAtTime(v,n+0.01);g.gain.exponentialRampToValueAtTime(0.0001,n+d);o.start(n);o.stop(n+d+0.03);}catch(e){}
}
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p);}catch(e){}};
let wake=null;
async function lockWake(){try{if('wakeLock' in navigator)wake=await navigator.wakeLock.request('screen');}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!$('#player').hidden)lockWake();});

function startPlayer(i){
  PS.steps=curSteps;PS.si=i;PS.gi=0;PS.t0=Date.now();PS.sets=0;PS.day=DAYS[sel];PS.from=i;
  tone(660,0.01,0.0002);
  $('#player').hidden=false;document.body.classList.add('locked');
  $('#plFinish').hidden=true;$('#plMainWrap').hidden=false;$('#plActs').hidden=false;
  lockWake();renderPlayer();
  clearInterval(PS.clock);PS.clock=setInterval(tickClock,1000);tickClock();
  $('#plMain').focus();
}
function closePlayer(){
  stopTimer();clearInterval(PS.clock);
  $('#player').hidden=true;document.body.classList.remove('locked');
  try{wake&&wake.release();}catch(e){}wake=null;
  renderWeek();renderDay();
}
function tickClock(){const s=Math.floor((Date.now()-PS.t0)/1000);$('#plClock').textContent=fmt(s);}
const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
const cur=()=>PS.steps[PS.si];
const seg=()=>cur().segs[PS.gi];
function nextWorkInfo(){
  const st=cur();
  for(let g=PS.gi+1;g<st.segs.length;g++)if(st.segs[g].type==='work')return segLabel(st.segs[g],st);
  const n=PS.steps[PS.si+1];return n?n.name:'Finish';
}
function segLabel(s,st){
  if(s.set)return `Set ${s.set} of ${s.of}${s.reps?', '+s.reps+' reps':''}`;
  return s.note||st.name;
}
function setFig(k){
  if(PS.figKey===k)return;PS.figKey=k;
  const stg=$('#plStage');stg.innerHTML='';stg.appendChild(makeFig(k,'pl-svg','full'));
}
function renderPlayer(){
  const st=cur(),s=seg(),ex=EX[st.x];
  const total=PS.steps.length;
  $('#plPhase').textContent=st.phase;
  $('#plCount').textContent=`${PS.si+1} of ${total}`;
  $('#plBar').style.width=((PS.si+(PS.gi/st.segs.length))/total*100)+'%';
  setFig(ex.tp);
  $('#plName').textContent=st.name;
  $('#plEq').textContent=ex.eq;
  $('#plCues').innerHTML=ex.cues.map(c=>`<li>${esc(c)}</li>`).join('');
  $('#plDemo').href=ytLink(ex.n);
  // set pips
  const works=st.segs.filter(x=>x.type==='work'&&x.set);
  const curSet=s.type==='work'?s.set:null;
  const doneSets=st.segs.slice(0,PS.gi).filter(x=>x.type==='work').length;
  $('#plSets').innerHTML=works.length>1?works.map((w,i)=>`<i class="${i<doneSets?'d':''}${curSet===w.set?' c':''}"></i>`).join(''):'';
  $('#plSets').setAttribute('aria-label',works.length>1?`Set ${Math.min(doneSets+1,works.length)} of ${works.length}`:'');
  const big=$('#plBig'),lbl=$('#plLbl'),up=$('#plUp'),ring=$('#plRing');let timed=false;
  const main=$('#plMain'),left=$('#plLeft'),right=$('#plRight');
  $('#plStage').classList.toggle('resting',s.type==='rest');$('#player').classList.toggle('resting-ui',s.type==='rest');
  $('#plWeight').hidden=!(s.type==='work'&&s.log);
  if(s.log){const v=store.w[st.x]||'';$('#plKg').value=v;}
  if(s.type==='rest'){
    big.textContent=fmt(Math.ceil(PS.left));
    lbl.textContent=s.switch?'Switch sides':'Rest';
    up.textContent='Next: '+nextWorkInfo();
    timed=true;
    left.textContent='+15 s';right.textContent='Next exercise';main.textContent='Skip rest';
  }else if(s.secs){
    big.textContent=fmt(Math.ceil(PS.running?PS.left:s.secs));
    lbl.textContent=s.set?`Set ${s.set} of ${s.of}`:(s.note||'Time');
    up.textContent=s.note&&s.set?s.note:'';
    timed=true;
    left.textContent='Previous';right.textContent='Next exercise';
    main.textContent=PS.running?'Pause':(PS.left>0&&PS.left<s.secs?'Resume':'Start timer');
  }else{
    big.textContent=s.reps;
    lbl.textContent=/[a-z]/i.test(s.reps)?'':'reps';
    up.textContent=s.set?`Set ${s.set} of ${s.of}${s.note?': '+s.note:''}`:(s.note||'');
    left.textContent='Previous';right.textContent='Next exercise';
    main.textContent=s.set&&s.set<s.of?'Set done':s.set?'Done, next exercise':'Done';
    if(s.set&&s.set===s.of&&PS.si===PS.steps.length-1)main.textContent='Finish';
  }
  big.classList.toggle('long',String(big.textContent).length>6);ring.toggleAttribute('hidden',!timed);big.parentElement.classList.toggle('timed',timed);
  updateRing();
}
function updateRing(){
  const s=seg();const c=$('#plArc');
  const tot=s.secs||1;const frac=s.type==='rest'||PS.running?Math.max(0,PS.left)/tot:(PS.left>0?PS.left/tot:1);
  const L=2*Math.PI*54;c.style.strokeDasharray=L;c.style.strokeDashoffset=L*(1-frac);
}
function startTimer(secs){
  stopTimer();PS.left=secs;PS.end=Date.now()+secs*1000;PS.running=true;let lastBeep=Math.ceil(secs);
  PS.timer=setInterval(()=>{
    PS.left=(PS.end-Date.now())/1000;
    const c=Math.ceil(PS.left);
    if(c<=3&&c>0&&c<lastBeep){tone(660,0.09);}
    lastBeep=Math.min(lastBeep,c);
    if(PS.left<=0){stopTimer();PS.left=0;tone(988,0.35,0.35);buzz([120,60,120]);advance();return;}
    $('#plBig').textContent=fmt(c);updateRing();
  },100);
  renderPlayer();
}
function stopTimer(){clearInterval(PS.timer);PS.timer=null;PS.running=false;}
function enterSeg(){
  const s=seg();PS.left=0;
  if(s.type==='rest')startTimer(s.secs);else{stopTimer();PS.left=0;renderPlayer();}
}
function advance(){
  const st=cur();
  if(seg().type==='work')PS.sets++;
  if(PS.gi<st.segs.length-1){PS.gi++;enterSeg();return;}
  if(PS.si<PS.steps.length-1){PS.si++;PS.gi=0;tone(523,0.12);enterSeg();return;}
  finish();
}
function goStep(d){stopTimer();PS.si=Math.max(0,Math.min(PS.steps.length-1,PS.si+d));PS.gi=0;enterSeg();}
function finish(){
  stopTimer();
  const day=PS.day,mins=Math.round((Date.now()-PS.t0)/60000);
  if(day.type!=='rest'&&PS.from<=WARM_GENERAL.length+WARM[day.type].length){
    store.done[weekKey]=[...new Set([...(store.done[weekKey]||[]),day.id])];
    for(const k of Object.keys(store.done))if(k<weekKey&&Object.keys(store.done).length>8)delete store.done[k];
    save();
  }
  $('#plMainWrap').hidden=true;$('#plActs').hidden=true;$('#plFinish').hidden=false;$('#player').classList.remove('resting-ui');
  $('#plBar').style.width='100%';
  $('#finTitle').textContent=day.type==='rest'?'Stretch done':day.title+' done';
  $('#finSub').textContent=`${mins} min, ${PS.sets} sets and holds completed.`+(day.type==='rest'?'':' Log heavier weights next time if every set hit the top of its rep range.');
  tone(784,0.18);setTimeout(()=>tone(1046,0.3),180);
  $('#finBack').focus();
}
$('#plMain').onclick=()=>{
  const s=seg();
  if(s.type==='rest'){stopTimer();tone(523,0.08);advance();return;}
  if(s.secs){
    if(PS.running){PS.left=(PS.end-Date.now())/1000;stopTimer();renderPlayer();}
    else startTimer(PS.left>0&&PS.left<s.secs?PS.left:s.secs);
    return;
  }
  tone(523,0.08);buzz(40);advance();
};
$('#plLeft').onclick=()=>{
  const s=seg();
  if(s.type==='rest'){PS.end+=15000;PS.left+=15;$('#plBig').textContent=fmt(Math.ceil(PS.left));
    s.secs=Math.max(s.secs,Math.ceil(PS.left));updateRing();return;}
  goStep(-1);
};
$('#plRight').onclick=()=>{if(PS.si<PS.steps.length-1)goStep(1);else finish();};
$('#plClose').onclick=closePlayer;
$('#finBack').onclick=closePlayer;
$('#plKg').addEventListener('change',e=>{const v=e.target.value.trim();if(v)store.w[cur().x]=v;else delete store.w[cur().x];save();});
function renderSound(){$('#plSound').setAttribute('aria-pressed',store.sound);$('#plSound').setAttribute('aria-label',store.sound?'Sound on':'Sound off');$('#plSound').classList.toggle('off',!store.sound);}
$('#plSound').onclick=()=>{store.sound=!store.sound;save();renderSound();};
renderSound();

document.addEventListener('keydown',e=>{
  if(!$('#player').hidden){
    if(e.key==='Escape')closePlayer();
    else if((e.key===' '||e.key==='Enter')&&e.target.tagName!=='INPUT'&&e.target.tagName!=='BUTTON'&&e.target.tagName!=='A'&&$('#plFinish').hidden){e.preventDefault();$('#plMain').click();}
    else if(e.key==='ArrowRight'&&e.target.tagName!=='INPUT')$('#plRight').click();
    else if(e.key==='ArrowLeft'&&e.target.tagName!=='INPUT')$('#plLeft').click();
  }else if(!$('#sheet').hidden&&e.key==='Escape')closeSheet();
});

/* rules */
$('#rulesList').innerHTML=RULES.map(([h,t])=>`<div><dt>${esc(h)}</dt><dd>${esc(t)}</dd></div>`).join('');

renderWeek();renderDay();

</script>
</body>
